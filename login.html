<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Log in to Rantech Academy."><title>Log in | Rantech Academy</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js" defer></script>
</head>
<body class="auth">
  <main class="card">
    <a class="brand" href="index.html"><span class="mark">R</span><span>Rantech <b>Academy</b></span></a>
    <span class="eyebrow">LOG IN</span><h1>Welcome back</h1>
    <p>Continue your learning journey with Rantech Academy.</p>
    <div id="message" class="message" hidden></div>
    <form id="loginForm">
      <label>Email<input name="email" type="email" placeholder="you@example.com" autocomplete="email" required></label>
      <label>Password<input name="password" type="password" placeholder="Your password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Log in</button>
    </form>
    <p class="switch">Don't have an account? <a href="signup.html">Create one</a></p>
    <a class="back" href="index.html">← Back to home</a>
  </main>
  <script>document.getElementById('loginForm').addEventListener('submit', RantechAuth.handleLogin);</script>
</body>
</html>
